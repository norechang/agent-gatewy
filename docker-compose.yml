services:
  opencode-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: opencode-server
    environment:
      # Map host UID/GID for file permissions
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      # Pass LLM provider API keys as environment variables
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Mount OpenCode user configuration (contains LLM provider credentials)
      - ${OPENCODE_CONFIG_PATH:-$HOME/.config/opencode}:/home/coder/.config/opencode
      # Mount persistent data (sessions, logs, auth)
      - ${OPENCODE_DATA_PATH:-$HOME/.local/share/opencode}:/home/coder/.local/share/opencode
      # Mount cache directory
      - ${OPENCODE_CACHE_PATH:-$HOME/.cache/opencode}:/home/coder/.cache/opencode
      # Mount agent definitions from this project
      - ./.opencode:/app/.opencode:ro
    working_dir: /app
    ports:
      - "4096:4096"
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4096/health || curl -f http://localhost:4096/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode-gateway
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - OPENCODE_SERVER_URL=http://opencode-server:4096
      - NODE_ENV=production
    depends_on:
      opencode-server:
        condition: service_healthy
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  gateway-network:
    driver: bridge
